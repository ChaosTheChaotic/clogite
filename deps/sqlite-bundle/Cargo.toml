[package]
name = "sqlite-bundle"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
sqlite-zstd = { git = "https://github.com/ChaosTheChaotic/sqlite-zstd", default-features = false, features = ["build_extension"] }
sqlite-regex = { path = "../../vendor/sqlite-regex" }
zstd-sys = "2.2.0"
